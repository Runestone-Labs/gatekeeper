name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    # Fresh throwaway Postgres per run so tests/integration/db-migrations.test.ts
    # proves the full migration set applies on an empty database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d migtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test:run
        env:
          GATEKEEPER_SECRET: test-secret-at-least-32-characters-long
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/migtest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/typescript-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Distribution readiness check
        run: npm run distribution-check
